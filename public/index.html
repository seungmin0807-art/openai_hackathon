<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>진료랑 놀아요!</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/game.css"><link rel="stylesheet" href="/tool-selector.css"><link rel="stylesheet" href="/clinic-ui.css"></head><body data-tool-choice="true"><div id="mori-app"><section id="tool-selection" aria-label="검사 도구 선택"></section>
<header class="app-header"><button id="choose-game" class="pill" aria-expanded="false" aria-controls="procedure-menu">☰ 놀이 바꾸기</button><span id="procedure-title"></span><button id="pause-button" class="pill">잠깐 쉬기 Ⅱ</button></header>
<main><div class="game-layout"><aside id="procedure-menu" class="procedure-menu" hidden><h2>뭐 해 볼까?</h2><div id="procedure-list" aria-label="진료 놀이 5개"></div></aside><section class="play-card" aria-label="진료 놀이">
<ol class="step-dots" hidden aria-label="놀이 순서"><li>해 보기</li><li>발견</li><li>이야기</li></ol>
<div class="stage-wrap"><div id="character-stage" class="character-stage" aria-label="진료 부위를 살펴보는 3D 놀이"></div><span id="body-hint" hidden></span><div id="pause-overlay" hidden><span>잠깐 쉬자 ☁</span><button id="resume-button" class="primary-button">다시 놀기</button></div><div id="result-effect" hidden>✦ 발견!</div></div>
<div class="game-hud"><div class="subtitle-wrap"><span id="subtitle-speaker" hidden>놀이 안내</span><p id="subtitle" aria-live="polite"></p><button id="read-button" class="read-button" aria-label="화면 글을 목소리로 듣기">♪</button></div><div class="hud-actions"><div id="game-actions" class="game-actions"></div><button id="voice-button" class="primary-button">🎤 말하기</button></div><p id="voice-status" role="status" hidden></p></div>
</section><details class="adult-options"><summary aria-label="추가 기능과 설정">⚙</summary><div class="settings-sheet"><h2 class="app-name">진료랑 놀아요!</h2><button id="replay-button" class="secondary-button">↻ 다시 해 보기</button><button id="question-button" class="secondary-button">왜 하는 거야?</button><button id="sample-button" class="secondary-button">목소리 듣기 ♪</button><div id="system-notice" class="system-notice" role="status" hidden></div></div></details>
<div hidden><span id="character-state"></span><div id="conversation" role="log"></div><button id="wave-button">인사</button><div id="voice-bars"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div></div></main>
<dialog id="consent-dialog" aria-labelledby="consent-title"><form method="dialog" class="consent-content"><h2 id="consent-title">같이 이야기할 준비 됐나요?</h2><p id="consent-copy">마이크 음성과 대화는 답변을 만들기 위해 AI 서비스에 전송돼요.</p><label class="consent-check"><input id="adult-test" type="checkbox"> 성인이 가상 상황으로 체험합니다.</label><label class="consent-check"><input id="guardian-check" type="checkbox"> 데이터 처리 안내를 확인하고 음성 전송에 동의합니다.</label><p id="consent-error" role="alert"></p><div class="dialog-actions"><button value="cancel" class="quiet-button">나중에 할래요</button><button id="consent-start" value="start" class="primary-button">이야기 시작</button></div></form></dialog>
</div><script src="/runtime-config.js"></script><script type="module" src="/app.js"></script></body></html>
