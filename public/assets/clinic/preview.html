<!doctype html><html lang="ko"><meta charset="utf-8"><title>로컬 캐릭터 표면 검토</title><style>body{margin:0;background:#e8ebe2;display:flex;gap:8px;font:16px sans-serif}figure{margin:8px}canvas{display:block;background:repeating-conic-gradient(#f7f6ef 0% 25%,#e7e7df 0% 50%) 0 0/24px 24px}figcaption{padding:8px}</style><figure id="patient"><figcaption>실제 토끼 GLB</figcaption></figure><figure id="doctor"><figcaption>실제 사람 의사 GLB</figcaption></figure><script type="module">
import * as T from '/vendor/three.js';
window.characterRenders={};window.characterRenderErrors=[];
async function render(id){const host=document.querySelector('#'+id),renderer=new T.WebGLRenderer({alpha:true,antialias:true,preserveDrawingBuffer:true});renderer.setSize(512,640);renderer.setPixelRatio(1);renderer.outputColorSpace=T.SRGBColorSpace;renderer.setClearColor(0x000000,0);host.prepend(renderer.domElement);const scene=new T.Scene();scene.add(new T.HemisphereLight(0xfff6e5,0xcbd5cd,2.5));const key=new T.DirectionalLight(0xfff4df,3);key.position.set(3,4,5);scene.add(key);const fill=new T.DirectionalLight(0xd8e7ff,1.5);fill.position.set(-4,2,3);scene.add(fill);const gltf=await new T.GLTFLoader().loadAsync('/assets/clinic/'+id+(new URLSearchParams(location.search).get(id)||'')+'.glb');const model=gltf.scene;scene.add(model);const mixer=new T.AnimationMixer(model),idle=gltf.animations.find(c=>c.name===(new URLSearchParams(location.search).get('clip')||'Idle'));if(idle&&!new URLSearchParams(location.search).has('rest')){mixer.clipAction(idle).play();mixer.update(.3);}model.updateMatrixWorld(true);const box=new T.Box3().setFromObject(model),size=box.getSize(new T.Vector3()),center=box.getCenter(new T.Vector3());const camera=new T.PerspectiveCamera(35,512/640,size.y*.01,size.y*15),distance=Math.max(size.y,size.x)*2.1;camera.position.set(center.x+size.x*.12,center.y+size.y*.03,center.z+distance);if(new URLSearchParams(location.search).has('side'))camera.position.set(center.x+distance,center.y+size.y*.03,center.z);camera.lookAt(center);renderer.render(scene,camera);const allBones=[];model.traverse(o=>{if(o.isBone)allBones.push({name:o.name,position:o.getWorldPosition(new T.Vector3()).toArray()})});window.characterRenders[id]={allBones,png:renderer.domElement.toDataURL('image/png'),box:box.min.toArray().concat(box.max.toArray()),animations:gltf.animations.map(c=>c.name),triangles:renderer.info.render.triangles,bones:Object.fromEntries(['Neck','Head','Body','Hips','UpperArm.L','UpperArm.R','UpperLeg.L','UpperLeg.R'].map(n=>{const o=model.getObjectByName(n);return[n,o?o.getWorldPosition(new T.Vector3()).toArray():null]}))};if(id==='patient'){const faceCamera=new T.PerspectiveCamera(28,1,.001,10000),faceCenter=new T.Vector3(center.x,box.min.y+size.y*.79,center.z),faceDistance=size.y*1.25;faceCamera.position.set(faceCenter.x,faceCenter.y,faceCenter.z+faceDistance);faceCamera.lookAt(faceCenter);renderer.setSize(512,512);renderer.render(scene,faceCamera);window.characterRenders.portrait={png:renderer.domElement.toDataURL('image/png')};renderer.setSize(512,640);renderer.render(scene,camera);} }
await Promise.all(['patient','doctor'].map(id=>render(id).catch(e=>window.characterRenderErrors.push({id,error:String(e)}))));window.characterPreviewReady=true;
</script></html>
